name: uGame v0.2.47 authority QA release

on:
  pull_request:
    paths:
      - 'server/expedition-authority*.mjs'
      - 'tests/expedition-authority.test.mjs'
      - 'package.json'
      - '.github/workflows/publish-v0247.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.2.47.md'
      - '.github/workflows/publish-v0247.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node authority code
        run: |
          node --check server/expedition-authority.mjs
          node --check server/expedition-authority-server.mjs
          node --check src/main.js
      - name: All regressions and HTTP integration tests
        run: npm test
      - name: Check versions and rollback
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          for (const file of ['version.json','package.json','data/preflight-manifest.json']) {
            if(JSON.parse(fs.readFileSync(file,'utf8')).version !== '0.2.47')throw Error('version mismatch '+file);
          }
          if(!fs.readFileSync('index.html','utf8').includes(\"expectedVersion: '0.2.47'\"))throw Error('preflight version mismatch');
          "
          gh release view v0.2.46
      - name: Publish QA prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.47 >/dev/null 2>&1; then
            gh release create v0.2.47 --target "$GITHUB_SHA" \
              --title "uGame v0.2.47 · Server-side expedition rooms for 12 participants (dev)" \
              --notes-file docs/releases/v0.2.47.md --prerelease
          fi
