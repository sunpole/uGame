name: uGame v0.2.33 QA release

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.2.33.md'
      - '.github/workflows/publish-v0233.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run both persistent regression suites
        run: node --test tests/master-loop.test.mjs tests/city-crafting.test.mjs
      - name: Verify version synchronization
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          for (const f of ['version.json','package.json','data/preflight-manifest.json']) {
            if (JSON.parse(fs.readFileSync(f,'utf8')).version !== '0.2.33') throw Error('Wrong version '+f);
          }
          if (!fs.readFileSync('index.html','utf8').includes('expectedVersion: \'0.2.33\'')) throw Error('Boot version mismatched');
          "
      - name: Confirm pre-batch GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v0.2.25
      - name: Create tagged candidate release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.33 >/dev/null 2>&1; then
            gh release create v0.2.33 --target "$GITHUB_SHA" --title "uGame v0.2.33 · 8-patch QA candidate" --notes-file docs/releases/v0.2.33.md --prerelease
          fi
