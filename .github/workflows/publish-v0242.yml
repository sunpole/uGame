name: uGame v0.2.42 QA release

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.2.42.md'
      - '.github/workflows/publish-v0242.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression suite
        run: npm test
      - name: Verify version and required files
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          for (const path of ['version.json', 'package.json', 'data/preflight-manifest.json']) {
            const version=JSON.parse(fs.readFileSync(path,'utf8')).version;
            if(version !== '0.2.42') throw Error('Version mismatch: '+path+' '+version);
          }
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes(\"expectedVersion: '0.2.42'\")) throw Error('Preflight boot mismatch');
          for (const path of ['src/resource-expedition-system.js', 'src/resource-expedition-view.js',
            'data/resource-expeditions.json', 'docs/releases/v0.2.42.md']) {
            if(!fs.existsSync(path)) throw Error('Missing required release file: '+path);
          }
          "
      - name: Verify v0.2.41 rollback release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v0.2.41
      - name: Publish v0.2.42 QA prerelease (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.42 >/dev/null 2>&1; then
            gh release create v0.2.42 --target "$GITHUB_SHA" \
              --title "uGame v0.2.42 · Resource Expedition QA" \
              --notes-file docs/releases/v0.2.42.md --prerelease
          fi
