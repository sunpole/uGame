name: uGame v0.2.76 Character Perspective and Scale QA and Release

# Historical published v0.2.76 CI/release. Keep for manual audit; no longer gate future versions.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 previous updater regression
        shell: powershell
        run: ./tests/Test-Updater.ps1
      - name: Windows PowerShell 5.1 texture publisher isolated Git regression
        shell: powershell
        run: ./tests/Test-Texture-Publish.ps1

  chromium-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and full Node suite
        run: |
          npm test
          node --input-type=module -e "
          import fs from 'node:fs';
          for(const p of ['version.json','package.json','data/preflight-manifest.json']){
            if(JSON.parse(fs.readFileSync(p,'utf8')).version !== '0.2.76')throw Error('version mismatch '+p);
          }
          if(!fs.readFileSync('index.html','utf8').includes(\"expectedVersion: '0.2.76'\"))throw Error('Pre-flight version mismatch');
          "
      - name: Install real Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Desktop/mobile Phaser camera angles, 3 scales, original, F5
        env:
          CI: 'true'
        run: node tests/browser-boot-smoke.mjs
      - name: Desktop/mobile Character Lab and Admin
        env:
          CI: 'true'
        run: |
          node tests/character-lab-browser-smoke.mjs
          node tests/character-lab-admin-browser-smoke.mjs
      - name: Preserve browser screenshots on error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v0276-browser-failures
          path: |
            artifacts/browser-smoke/
            artifacts/character-lab/
            artifacts/character-admin/
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows-updater, chromium-and-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify world data and camera unchanged, artist texture blobs preserved
        run: |
          test "$(git rev-parse HEAD:assets/textures/biomes/ground_1024.jpg)" = "3104ad3bc4e1b226f3126411d23bd126444594ce"
          test "$(git rev-parse HEAD:assets/textures/biomes/city_ground_1024.jpg)" = "04e2ca4b0f4b8d2f2cc352e5c8adb078c9cb2b23"
          test "$(git rev-parse HEAD:data/world.json)" = "$(git rev-parse v0.2.75:data/world.json)"
          test "$(git rev-parse HEAD:src/world-map-camera.js)" = "$(git rev-parse v0.2.75:src/world-map-camera.js)"
      - name: Confirm previous immutable release rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.75
          git fetch origin tag v0.2.75
          test "$(git rev-parse v0.2.75^{commit})" = "0b112f23c84142a80d702a1d18a8e076123a750f"
      - name: Publish QA prerelease after both test platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.76 >/dev/null 2>&1; then
            gh release create v0.2.76 --target "$GITHUB_SHA" --title "uGame v0.2.76 · Neutral 3/4 vs High Top-Down Sizes" --notes-file docs/releases/v0.2.76.md --prerelease
          fi
          gh release view v0.2.76
          git fetch --force origin tag v0.2.76
          test "$(git rev-parse v0.2.76^{commit})" = "$GITHUB_SHA"
