name: uGame v0.2.51 responsive chrome and Master rarity audit

on:
  pull_request:
    paths:
      - 'src/style.css'
      - 'src/main.js'
      - 'src/project-hub-system.js'
      - 'src/master-rarity-audit.js'
      - 'tests/master-rarity-header.test.mjs'
      - 'package.json'
      - '.github/workflows/publish-v0251.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.2.51.md'
      - '.github/workflows/publish-v0251.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check src/master-rarity-audit.js
          node --check src/project-hub-system.js
          node --check src/main.js
      - name: Full regression suite
        run: npm test
      - name: Version consistency and rollback
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          for(const p of ['version.json','package.json','data/preflight-manifest.json']){
            if(JSON.parse(fs.readFileSync(p,'utf8')).version !== '0.2.51')throw Error('version mismatch '+p);
          }
          if(!fs.readFileSync('index.html','utf8').includes(\"expectedVersion: '0.2.51'\"))throw Error('preflight mismatch');
          "
          gh release view v0.2.50
      - name: Publish QA prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.51 >/dev/null 2>&1; then
            gh release create v0.2.51 --target "$GITHUB_SHA" \
              --title "uGame v0.2.51 · Responsive header and Master rarity audit" \
              --notes-file docs/releases/v0.2.51.md --prerelease
          fi
