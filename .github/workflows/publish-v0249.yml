name: uGame v0.2.49 World Map and Analyzer QA

on:
  pull_request:
    paths:
      - 'src/project-hub-system.js'
      - 'src/style.css'
      - 'tests/world-navigation-ui.test.mjs'
      - 'package.json'
      - '.github/workflows/publish-v0249.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.2.49.md'
      - '.github/workflows/publish-v0249.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Project Hub syntax
        run: node --check src/project-hub-system.js
      - name: Full regression suite
        run: npm test
      - name: Verify release and rollback checkpoint
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          for(const path of ['version.json','package.json','data/preflight-manifest.json']){
            if(JSON.parse(fs.readFileSync(path,'utf8')).version !== '0.2.49')throw Error('version mismatch '+path);
          }
          if(!fs.readFileSync('index.html','utf8').includes(\"expectedVersion: '0.2.49'\"))throw Error('preflight mismatch');
          "
          gh release view v0.2.48
      - name: Publish v0.2.49 prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.49 >/dev/null 2>&1; then
            gh release create v0.2.49 --target "$GITHUB_SHA" \
              --title "uGame v0.2.49 · Find Me on World Map and all Master resources" \
              --notes-file docs/releases/v0.2.49.md --prerelease
          fi
