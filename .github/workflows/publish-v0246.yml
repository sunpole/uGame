name: uGame v0.2.46 inventory QA and release

on:
  pull_request:
    paths:
      - 'src/inventory-*.js'
      - 'src/container-system.js'
      - 'data/containers.json'
      - 'tests/inventory-organizer.test.mjs'
      - 'package.json'
      - '.github/workflows/publish-v0246.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.2.46.md'
      - '.github/workflows/publish-v0246.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check src/inventory-management.js
          node --check src/inventory-panel-system.js
          node --check src/container-system.js
          node --check src/main.js
      - name: Run complete regressions
        run: npm test
      - name: Validate version and rollback
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          for (const file of ['version.json','package.json','data/preflight-manifest.json']) {
            if (JSON.parse(fs.readFileSync(file,'utf8')).version !== '0.2.46') throw Error('version mismatch: '+file);
          }
          if (!fs.readFileSync('index.html','utf8').includes(\"expectedVersion: '0.2.46'\")) throw Error('preflight mismatch');
          "
          gh release view v0.2.45
      - name: Publish inventory QA prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.46 >/dev/null 2>&1; then
            gh release create v0.2.46 --target "$GITHUB_SHA" \
              --title "uGame v0.2.46 · Inventory organizer and Resource Chest" \
              --notes-file docs/releases/v0.2.46.md --prerelease
          fi
