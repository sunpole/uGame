name: uGame v0.2.74 Level-up and Stats QA and Release

on:
  pull_request:
    paths:
      - 'src/project-hub-system.js'
      - 'src/style.css'
      - 'src/main.js'
      - 'src/character-skills.js'
      - 'tests/character-skills.test.mjs'
      - 'src/dev-code-aliases.js'
      - 'docs/DEV-CODES.md'
      - 'src/game-state.js'
      - 'src/hero-identity.js'
      - 'src/hero-creation.js'
      - 'src/hero-start-profile.js'
      - 'src/chrome-header-system.js'
      - 'assets/characters/**'
      - 'tests/hero-creation.test.mjs'
      - 'src/character-draft.js'
      - 'src/character-runtime.js'
      - 'src/action-meter.js'
      - 'src/xp-meter.js'
      - 'src/character-progression.js'
      - 'tests/character-progression.test.mjs'
      - 'data/character-xp-curve.json'
      - 'docs/CHARACTER-XP-PROGRESSION.md'
      - 'tests/xp-action-hud.test.mjs'
      - 'src/dev-character-tools.js'
      - 'src/dev-console.js'
      - 'tests/dev-code-aliases.test.mjs'
      - 'tests/dev-character-tools.test.mjs'
      - 'tests/character-runtime-orbs.test.mjs'
      - 'data/project-hub.json'
      - 'tests/character-draft-runtime.test.mjs'
      - 'docs/project-journal/records/UGD-0038-anton-character-stats-draft.md'
      - 'tests/browser-boot-smoke.mjs'
      - 'docs/releases/v0.2.74.md'
      - 'version.json'
      - 'package.json'
      - 'index.html'
      - 'data/preflight-manifest.json'
      - '.github/workflows/publish-v0274.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.2.74.md'
      - '.github/workflows/publish-v0274.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 previous updater regression
        shell: powershell
        run: ./tests/Test-Updater.ps1
      - name: Windows PowerShell 5.1 texture publisher isolated Git regression
        shell: powershell
        run: ./tests/Test-Texture-Publish.ps1

  chromium-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and full Node suite
        run: |
          npm test
          node --input-type=module -e "
          import fs from 'node:fs';
          for(const p of ['version.json','package.json','data/preflight-manifest.json']){
            if(JSON.parse(fs.readFileSync(p,'utf8')).version !== '0.2.74')throw Error('version mismatch '+p);
          }
          if(!fs.readFileSync('index.html','utf8').includes(\"expectedVersion: '0.2.74'\"))throw Error('Pre-flight version mismatch');
          "
      - name: Install real Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Desktop/mobile XP level-up, manual VYN, F5 and Phaser
        env:
          CI: 'true'
        run: node tests/browser-boot-smoke.mjs
      - name: Desktop/mobile Character Lab and Admin
        env:
          CI: 'true'
        run: |
          node tests/character-lab-browser-smoke.mjs
          node tests/character-lab-admin-browser-smoke.mjs
      - name: Preserve browser screenshots on error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v0274-browser-failures
          path: |
            artifacts/browser-smoke/
            artifacts/character-lab/
            artifacts/character-admin/
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows-updater, chromium-and-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify world data and camera unchanged, artist texture blobs preserved
        run: |
          test "$(git rev-parse HEAD:assets/textures/biomes/ground_1024.jpg)" = "3104ad3bc4e1b226f3126411d23bd126444594ce"
          test "$(git rev-parse HEAD:assets/textures/biomes/city_ground_1024.jpg)" = "04e2ca4b0f4b8d2f2cc352e5c8adb078c9cb2b23"
          test "$(git rev-parse HEAD:data/world.json)" = "$(git rev-parse v0.2.73:data/world.json)"
          test "$(git rev-parse HEAD:src/world-map-camera.js)" = "$(git rev-parse v0.2.73:src/world-map-camera.js)"
      - name: Confirm previous immutable release rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.73
          git fetch origin tag v0.2.73
          test "$(git rev-parse v0.2.73^{commit})" = "e7d17e18915e5a15cfdce9beece1266b1c1f2bbd"
      - name: Publish QA prerelease after both test platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.74 >/dev/null 2>&1; then
            gh release create v0.2.74 --target "$GITHUB_SHA" --title "uGame v0.2.74 · Level-up + VYN/LOV/INT" --notes-file docs/releases/v0.2.74.md --prerelease
          fi
          gh release view v0.2.74
          git fetch --force origin tag v0.2.74
          test "$(git rev-parse v0.2.74^{commit})" = "$GITHUB_SHA"
