<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uGame v0.0.8</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <strong class="brand">uGame</strong>
        <span class="version" id="app-version">v0.0.8</span>
      </header>

      <main class="game-shell">
        <div id="game" aria-label="Игровая зона uGame"></div>
      </main>

      <footer class="bottombar">
        <span class="controls-help">Движение: WASD / стрелки</span>

        <form id="dev-console" class="dev-console" autocomplete="off">
          <label for="dev-code-input">DEV</label>
          <input
            id="dev-code-input"
            name="dev-code"
            type="text"
            inputmode="numeric"
            maxlength="4"
            pattern="[0-9]{4}"
            placeholder="0000"
            aria-label="DEV код из четырёх цифр"
          />
          <button type="submit">OK</button>
          <span id="dev-code-status" class="dev-code-status" aria-live="polite"></span>
        </form>

        <span id="zone-status">Zone 1 · Найди выход справа</span>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
