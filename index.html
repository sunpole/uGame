<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uGame v0.0.34</title>
    <link rel="stylesheet" href="./src/style.css?v=0.0.34" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <strong class="brand">uGame</strong>
        <span class="version" id="app-version">v0.0.34</span>
      </header>

      <main class="game-shell">
        <div id="game">
          <div class="game-hud">
            <span id="player-state">Stamina 100</span>
            <span id="resource-status">Камень 0 · Дерево 0 · Вода 0 · Внимание 0 · Фрагменты 0/3</span>
            <span id="inventory-status">Инвентарь: пусто</span>
            <span id="zone-rule-status"></span>
          </div>
          <div id="quest-status" class="quest-status">Загрузка квеста…</div>
          <div id="interact-prompt" class="interact-prompt"></div>

          <section id="dialogue-panel" class="dialogue-panel" hidden>
            <strong id="dialogue-speaker" class="dialogue-speaker"></strong>
            <p id="dialogue-text"></p>
            <button id="dialogue-next" type="button">Дальше</button>
          </section>

          <section id="interaction-panel" class="interaction-panel" hidden>
            <div class="interaction-header">
              <strong id="interaction-title">Событие</strong>
              <button id="interaction-close" type="button">Закрыть</button>
            </div>
            <p id="interaction-text"></p>
            <div id="interaction-options" class="interaction-options"></div>
            <div id="interaction-meta" class="interaction-meta"></div>
          </section>

          <div id="touch-controls" class="touch-controls">
            <div class="touch-dpad">
              <button type="button" data-control="up">↑</button>
              <button type="button" data-control="left">←</button>
              <button type="button" data-control="down">↓</button>
              <button type="button" data-control="right">→</button>
            </div>
            <div class="touch-actions">
              <button type="button" data-control="dash">Рывок</button>
              <button type="button" data-control="action">Действие</button>
            </div>
          </div>
        </div>
      </main>

      <footer class="bottombar">
        <span class="controls-help">
          <span>WASD / стрелки · E / Space / Enter действие · Shift рывок</span>
        </span>

        <div class="mouse-controls" aria-label="Управление мышью">
          <button id="arrow-left" class="mouse-control arrow-key" type="button" data-control="left" title="Влево">←</button>
          <button id="arrow-up" class="mouse-control arrow-key" type="button" data-control="up" title="Вверх">↑</button>
          <button id="arrow-down" class="mouse-control arrow-key" type="button" data-control="down" title="Вниз">↓</button>
          <button id="arrow-right" class="mouse-control arrow-key" type="button" data-control="right" title="Вправо">→</button>
          <button class="mouse-control mouse-control-action" type="button" data-control="action" title="Действие">Действие</button>
          <button class="mouse-control mouse-control-dash" type="button" data-control="dash" data-control-mode="pulse" title="Короткий импульс рывка">Рывок</button>
        </div>

        <form id="dev-console" class="dev-console" autocomplete="off">
          <label for="dev-code-input">DEV</label>
          <input id="dev-code-input" name="dev-code" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="0000" />
          <button type="submit">OK</button>
          <span id="dev-code-status" class="dev-code-status"></span>
        </form>

        <span id="zone-status">Перекрёсток</span>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js?v=0.0.34"></script>
  </body>
</html>
